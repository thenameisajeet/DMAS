<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>
    DMAS Gateway
  </title>

  <link rel="preconnect"
  href="https://fonts.googleapis.com">

  <link rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet">

  <link rel="stylesheet"
  href="gateway.css">

</head>

<body>

  <div class="gateway-container">

    <div class="gateway-card">

      <div class="gateway-logo">

        <h1>
          <span>D</span>MAS
        </h1>

        <p>
          Disaster Management Alert System
        </p>

      </div>


      <div class="gateway-content">

        <h2>
          Secure Access Gateway
        </h2>

        <p>
          Select your system access role to continue into the emergency management network.
        </p>

      </div>


      <div class="gateway-buttons">

        <button
        class="admin-btn"
        onclick="window.location.href='admin-login.html'">

          Admin Access

        </button>

        <button
        class="student-btn"
        onclick="window.location.href='student-login.html'">

          Student Access

        </button>

      </div>

    </div>

  </div>

</body>

</html>
